services:
  - type: web
    name: womens-secret-site
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: womens-secret-db
          property: connectionString
      - key: PGSSL
        value: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: womens-secret-db
    plan: free
    databaseName: womens_secret
    user: womens_secret
